name: Fetch free 3D packs

# Downloads free CC0 3D model packs by Kenney (kenney.nl) and saves them into assets/kits/.
on:
  workflow_dispatch:
    inputs:
      kits:
        description: "Kenney kit page names, space separated"
        default: "city-kit-suburban city-kit-roads city-kit-commercial car-kit nature-kit furniture-kit"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download kits
        run: |
          mkdir -p assets/kits
          for k in ${{ inputs.kits }}; do
            curl -sL -c /tmp/ck -b /tmp/ck "https://kenney.nl/assets/$k" -o /tmp/page.html
            id=$(grep -oE 'data-download-id="[0-9a-f]+"' /tmp/page.html | head -1 | cut -d'"' -f2)
            url=$(curl -sL -c /tmp/ck -b /tmp/ck -H "Referer: https://kenney.nl/assets/$k" "https://kenney.nl/download-link/$id" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")
            echo "$k -> $url"
            [ -z "$url" ] && continue
            curl -sL "$url" -o /tmp/$k.zip
            rm -rf /tmp/$k && mkdir -p /tmp/$k && unzip -q /tmp/$k.zip -d /tmp/$k
            mkdir -p assets/kits/$k
            find /tmp/$k -path "*GLB*" -name "*.glb" -exec cp {} assets/kits/$k/ \;
            find /tmp/$k -iname "*colormap*.png" -exec cp {} assets/kits/$k/ \; 2>/dev/null || true
            find /tmp/$k -path "*GLB*" -name "*.png" -exec cp {} assets/kits/$k/ \; 2>/dev/null || true
            cp /tmp/$k/License.txt assets/kits/$k/ 2>/dev/null || true
            echo "$k: $(ls assets/kits/$k | wc -l) files"
          done
          du -sh assets/kits/*
      - name: Save into the repo
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kits && git commit -m "Add free CC0 Kenney 3D kits" && git push || echo "nothing new"
